{% extends 'base.html' %}
{% load static %}
{% block title %}Cadastro de Banner - Rhapsody{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/styleCadastro.css' %}">
{% endblock %}
{% block content %}
{% if messages %}
    {% for message in messages %}
        <div class="popup">{{ message }}</div>
    {% endfor %}
{% endif %}
<div class="container">
    <h2>Cadastrar Banner</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Título</label>
        <input type="text" name="titulo" maxlength="100" required>
        <label>Imagem</label>
        <input type="file" name="imagem" accept="image/*" required>
        <label>Link de Destino</label>
        <input
            type="text"
            name="link"
            placeholder="/categoria/yugioh/"
            required
        >
        <label>Banner Ativo</label>
        <select name="ativo">
            <option value="true">Sim</option>
            <option value="false">Não</option>
        </select>
        <label>Ordem de Exibição</label>
        <input
            type="number"
            name="ordem"
            value="0"
            min="0"
        >
        <button type="submit">
            Cadastrar Banner
        </button>
    </form>
</div>
{% endblock %}
