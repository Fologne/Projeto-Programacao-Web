{% extends 'base.html' %}
{% load static %}
{% block title %}Login{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/styleCadastro.css' %}">
{% endblock %}
{% block content %}
{% if messages %}
    {% for message in messages %}
        <div class="popup">{{ message }}</div>
    {% endfor %}
{% endif %}
<div class="login-container">
    <h2>Entrar na Rhapsody</h2>
    <form class ="cadastro-form login-form" method="POST">
        {% csrf_token %}
        <div class="campo">
            <label>Usuário ou Email</label>
            <input
                type="text"
                name="login"
                placeholder="Digite seu usuário ou email"
                required
            >
        </div>
        <div class="campo">
            <label>Senha</label>
            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >
        </div>
        <button type="submit">
            Entrar
        </button>
    </form>
</div>
<script src="{% static 'js/cadastro.js' %}"></script>
{% endblock %}
