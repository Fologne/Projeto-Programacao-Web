{% extends 'base.html' %}
{% load static %}
{% block title %}Alterar Produto{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/alteraProduto.css' %}">
{% endblock %}
{% block content %}
<div class="altera-container">
    <div class="produto-preview">
        <div class="img-box">
            {% if produto.imagem %}
                <img id="preview" src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">
            {% else %}
                <img id="preview" src="{% static 'imagens/sem-imagem.png' %}">
            {% endif %}
        </div>
    </div>
    <div class="form-container">
        <h1>✏️ Alterar Produto</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Nome</label>
            <input type="text" name="nome" value="{{ produto.nome }}" required>
            <label>Descrição</label>
            <textarea name="descricao">{{ produto.descricao }}</textarea>
            <label>Preço</label>
            <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
            <label>Imagem</label>
            <input type="file" name="imagem" id="imagemInput">
            <label>Estoque</label>
            <input type="number" name="estoque" value="{{ produto.estoque }}" required>
            <label>Categoria</label>
            <select name="categoria">
                {% for c in categorias %}
                    <option value="{{ c.id }}"
                    {% if produto.categoria.id == c.id %}selected{% endif %}>
                        {{ c.nome }}
                    </option>
                {% endfor %}
            </select>
            <label>Tipo</label>
            <select name="tipo">
                {% for t in tipos %}
                    <option value="{{ t.id }}"
                    {% if produto.tipo.id == t.id %}selected{% endif %}>
                        {{ t.nome }}
                    </option>
                {% endfor %}
            </select>
            <div class="checkbox-area">
                <input type="checkbox"
                       name="esta_disponivel"
                       id="disp"
                       {% if produto.esta_disponivel %}
                            checked
                       {% endif %}
                >
                <label for="disp">Produto Disponível</label>
            </div>
            <button type="submit">
                💾 Salvar Alterações
            </button>
        </form>
    </div>
</div>
<script>
const input = document.getElementById("imagemInput");
const preview = document.getElementById("preview");
input.addEventListener("change", function(){
    const file = this.files[0];
    if(file){
        preview.src = URL.createObjectURL(file);
    }
});
</script>
{% endblock %}
